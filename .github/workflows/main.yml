
name: Build VoloX Battle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Create build folder
        run: mkdir -p build

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/VoloX_Battle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoloX-Battle-APK
          path: build/VoloX_Battle.apk
          if-no-files-found: error
